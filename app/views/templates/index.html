<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KriptoGRAM - Güvenli Mesajlaşma</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Kütüphaneler -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</head>
<body>
<!-- GİRİŞ & KAYIT MODALI -->
<div id="login-modal" class="modal-overlay" style="display: flex;"> <!-- login eklendikten sonra display:none yapılacak-->
    <div class="modal-card">
        <div class="modal-header">
            <i class="fa-solid fa-shield-halved"></i>
            <h2>KriptoGRAM</h2>
        </div>

        <!-- Giriş / Kayıt Sekmeleri -->
        <div style="display: flex; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px;">
            <button id="tab-login-btn" onclick="switchAuthTab('login')" style="flex: 1; padding: 10px; background: transparent; border: none; border-bottom: 2px solid #38bdf8; color: #38bdf8; font-weight: bold; cursor: pointer;">Giriş Yap</button>
            <button id="tab-register-btn" onclick="switchAuthTab('register')" style="flex: 1; padding: 10px; background: transparent; border: none; border-bottom: 2px solid transparent; color: #94a3b8; font-weight: bold; cursor: pointer;">Kayıt Ol</button>
        </div>

        <div class="modal-body">
            <label for="username-input">Kullanıcı Adı</label>
            <input type="text" id="username-input" placeholder="Örn: ahmet_crypto" maxlength="20" autocomplete="off">
            
            <label for="password-input">Şifre</label>
            <div style="position: relative;">
                <input type="password" id="password-input" placeholder="••••••••" maxlength="32" autocomplete="off" style="width: 100%; box-sizing: border-box; padding-right: 35px;">
                <i id="toggle-password" class="fa-solid fa-eye-slash" onclick="togglePasswordVisibility()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #94a3b8; font-size: 14px;"></i>
            </div>

            <label for="room-select">Katılınacak Oda</label>
            <select id="room-select">
                <option value="genel">Genel Sohbet Odası</option>
                <option value="kripto-lab">Kriptoloji Odası</option>
                <option value="ozel-1">Özel Tünel</option>
            </select>

            <div id="auth-error-msg" style="display: none; color: #ef4444; font-size: 12px; margin-top: 8px;"></div>
            <div id="auth-success-msg" style="display: none; color: #22c55e; font-size: 12px; margin-top: 8px;"></div>
        </div>

        <!-- Tek Dinamik Aksiyon Butonu -->
        <div style="width: 100%; margin-top: 10px;">
            <button id="auth-main-btn" onclick="handleAuthSubmit()" style="width: 100%; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer;">Giriş Yap</button>
        </div>
    </div>
</div>
    <!-- Ayarlar Modalı -->
    <div id="profile-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <i class="fa-solid fa-user-gear"></i>
                <h2>Ayarlar</h2>
            </div>
            <div class="modal-body">
                <label>Kullanıcı Adı</label>
                <input type="text" id="profile-username-input" value="" readonly style="opacity: 0.7;">
                
                <label>İstemci Kimliği (Session ID)</label>
                <input type="text" id="profile-session-id" value="" readonly style="opacity: 0.5;">

                <label>Varsayılan Anahtar Tipi</label>
                <select id="profile-default-key">
                    <option value="KYBER">Kyber (ML-KEM-768)</option>
                    <option value="RSA">RSA-2048</option>
                    <option value="ECC">ECC (ECDH)</option>
                    <option value="DH">Diffie-Hellman 2048</option>
                </select>
            </div>
            <button onclick="closeProfileModal()" style="background: var(--bg-card); margin-bottom: 8px;">Kapat</button>
            <button onclick="saveProfileSettings()">Kaydet</button>
        </div>
    </div>

    <!-- Uygulama Ana Ekranı -->
    <div class="app-container">
        <!-- Sol Bar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar" id="my-avatar">?</div>
                    <div class="user-info">
                        <span id="display-username" class="username">Misafir</span><br>
                        <span class="status-online">Çevrimiçi</span>
                    </div>
                    <button class="btn-icon" onclick="openProfileModal()" title="Profil & Ayarlar">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </div>

            <div class="sidebar-section">
                <h3><i class="fa-solid fa-door-open"></i> Aktif Oda</h3>
                <div class="room-badge" id="current-room-badge">Genel Sohbet Odası</div>
            </div>

            <div class="sidebar-section list-section">
                <h3><i class="fa-solid fa-users"></i> Odadaki Kullanıcılar (<span id="user-count">0</span>)</h3>
                <ul id="online-users-list" class="user-list"></ul>
            </div>
        </aside>

        <!-- Chat Alanı -->
        <main class="chat-area">
            <header class="chat-header">
                <div class="chat-title-group">
                    <i class="fab fa-telegram" aria-hidden="true"></i>
                    <div>
                        <h2>KriptoGRAM</h2>
                        <small id="connection-status">Bağlanıyor...</small>
                    </div>
                </div>

                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="chat-search-input" placeholder="Sohbette ara..." onkeyup="filterMessages()">
                </div>

                <div class="crypto-controls">
                    <div class="control-item">
                        <label><i class="fa-solid fa-lock"></i> Mod:</label>
                        <select id="mode-select">
                            <option value="GUVENSIZ">Güvensiz</option>
                            <option value="GUVENLI" selected>Güvenli</option>
                        </select>
                    </div>

                    <div class="control-item">
                        <label><i class="fa-solid fa-key"></i> Yöntem:</label>
                        <select id="key-select">
                            <option value="KYBER">Kyber (ML-KEM-768)</option>
                            <option value="RSA">RSA-2048</option>
                            <option value="ECC">ECC (ECDH)</option>
                            <option value="DH">Diffie-Hellman 2048</option>
                        </select>
                    </div>

                    <button class="btn-delete-chat" onclick="clearChatHistory()" title="Sohbeti Temizle">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>

                <div class="logout" id="logout" >
                    <button style="color: white;background-color: #38bdf8; border:solid 2px red;" type="button" onclick="logoutUser()"> Çıkış Yap</button>
                </div>
                
            </header>

            <div class="messages-container" id="messages-container">
                <div class="system-message">
                    <span>Hemen Mesajlaşın.</span>
                </div>
            </div>

            <!-- Mesaj ve Dosya Input Alanı -->
            <footer class="chat-input-area">
                <div class="input-wrapper">
                    <label for="file-input" class="btn-attach" title="PDF / Resim Gönder">
                        <i class="fa-solid fa-paperclip"></i>
                    </label>
                    <input type="file" id="file-input" accept="image/*,application/pdf" style="display: none;">

                    <input type="text" id="message-input" placeholder="Mesajınızı yazın..." autocomplete="off">
                    
                    <button id="btn-send" onclick="sendMessage()">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </footer>
        </main>
    </div>


    <script type="importmap">
        {
        "imports": {
            "mlkem": "https://esm.sh/mlkem@2.7.0"
        }
        }
    </script>
    <!-- Uygulama Scripti -->
     <script type="module" src="{{ url_for('static', filename='js/cipher.js') }}"></script>
    <script src="{{ url_for('static', filename='js/basic.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
    

    

</body>
</html>
