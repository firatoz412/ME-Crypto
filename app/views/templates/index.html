<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana Sayfa</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    
</head>
<body>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
     
        <div id="login-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <i class="fa-solid fa-shield-halved"></i>
                <h2>ME-Crypto'ya Katıl</h2>
            </div>
            <div class="modal-body">
                <label for="username-input">Kullanıcı Adı</label>
                <input type="text" id="username-input" placeholder="Örn: ahmet_crypto" maxlength="20">
                
                <label for="room-select">Katılınacak Oda</label>
                <select id="room-select">
                    <option value="genel">Genel Sohbet Odası</option>
                    <option value="kripto-lab"> Kriptoloji Odası</option>
                    <option value="ozel-1">Özel Tünel</option>
                </select>
            </div>
            <button id="btn-login" onclick="joinChat()">Sohbete Başla</button>
        </div>
    </div>
    

    <!-- Ayarlar Modalı -->
    <div id="profile-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <i class="fa-solid fa-user-gear"></i>
                <h2>Ayarlar</h2>
            </div>
            <div class="modal-body">
                <label>Kullanıcı Adı</label>
                <input type="text" id="profile-username-input" value="" readonly style="opacity: 0.7;">
                
                <label>İstemci Kimliği (Session ID)</label>
                <input type="text" id="profile-session-id" value="Sess_982a7f11" readonly style="opacity: 0.5;">

                <label>Varsayılan Anahtar Tipi</label>
                <select id="profile-default-key">
                    <option value="KYBER">Kyber (ML-KEM-768)</option>
                    <option value="RSA">RSA-2048</option>
                    <option value="ECC">ECC (ECDH)</option>
                    <option value="DH">Diffie-Hellman 2048</option>
                </select>
            </div>
            <button onclick="closeProfileModal()" style="background: var(--bg-card); margin-bottom: 8px;">Kapat</button>
            <button onclick="saveProfileSettings()">Kaydet</button>
        </div>
    </div>

    <!-- Uygulama ana ekranı-->
    <div class="app-container">
        
        <!-- Sol bar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar" id="my-avatar">?</div>
                    <div class="user-info">
                        <span id="display-username" class="username">Misafir</span></br>
                        <span class="status-online">Çevrimiçi</span>
                    </div>
                    <!-- Ayarlar-->
                    <button class="btn-icon" onclick="openProfileModal()" title="Profil & Ayarlar">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </div>

            <div class="sidebar-section">
                <h3><i class="fa-solid fa-door-open"></i> Aktif Oda</h3>
                <div class="room-badge" id="current-room-badge">Genel Sohbet</div>
            </div>

            <div class="sidebar-section list-section">
                <h3><i class="fa-solid fa-users"></i> Odadaki Kullanıcılar (<span id="user-count">0</span>)</h3>
                <ul id="online-users-list" class="user-list"></ul>
            </div>
        </aside>

        <!-- chat alanı -->
        <main class="chat-area">
            
            <!-- ÜST HEADER  -->
            <header class="chat-header">
                <!-- Logo ve Başlık -->
                <div class="chat-title-group">
                    <i class="fab fa-telegram" aria-hidden="true"></i>
                    <div>
                      
                        <h2>KriptoGRAM</h2>
                        <small id="connection-status">Bağlanıyor...</small>
                    </div>
                </div>

                <!-- Search -->
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="chat-search-input" placeholder="Sohbette ara..." onkeyup="filterMessages()">
                </div>

                <!-- Modlar -->
                <div class="crypto-controls">
                    <div class="control-item">
                        <label><i class="fa-solid fa-lock"></i> Mod:</label>
                        <select id="mode-select">
                            <option value="GUVENSIZ">Güvensiz</option>
                            <option value="GUVENLI" selected>Güvenli</option>
                        </select>
                    </div>

                    <div class="control-item">
                        <label><i class="fa-solid fa-key"></i> Yöntem:</label>
                        <select id="key-select">
                            <option value="KYBER">Kyber (ML-KEM-768)</option>
                            <option value="RSA">RSA-2048</option>
                            <option value="ECC">ECC (ECDH)</option>
                            <option value="DH">Diffie-Hellman 2048</option>
                        </select>
                    </div>

                    <!-- sil butonu -->
                    <button class="btn-delete-chat" onclick="clearChatHistory()" title="Sohbeti Temizle">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </header>

            <div class="messages-container" id="messages-container">
                <div class="system-message">
                    <span>Hemen Mesajlaşın.</span>
                </div>
            </div>

            <!-- Mesaj input alanı -->
            <footer class="chat-input-area">
                <div class="input-wrapper">
                    <label for="file-input" class="btn-attach" title="PDF / Dosya Gönder">
                        <i class="fa-solid fa-paperclip"></i>
                    </label>
                    <input type="file" id="file-input" accept=".pdf,.doc,.docx,.png,.jpg" style="display: none;">

                    <input type="text" id="message-input" placeholder="Mesajınızı yazın..." autocomplete="off">
                    
                    <button id="btn-send" onclick="sendMessage()">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </footer>
        </main>
    </div>
</body>
</html>
